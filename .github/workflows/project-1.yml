name: Java CI Build

on:
  push:
    branches: ["main" ]
    paths:
      - 'DevOps-Project-01/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # Optional: switch to the project directory before building if needed
      run: cd DevOps-Project-01/Java-Login-App && mvn clean package

    - name: Save the Artifact (WAR file)
      uses: actions/upload-artifact@v4
      with:
        name: dptweb-app
        path: DevOps-Project-01/Java-Login-App/target/dptweb-1.0.war

    - name: Copy WAR to Tomcat via Bastion Host
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.TOMCAT_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_KEY }}
        proxy_host: ${{ secrets.BASTION_IP }}
        proxy_username: ubuntu
        proxy_key: ${{ secrets.SSH_KEY }}
        source: "target/dptweb-1.0.war"
        target: "/home/ubuntu/"

    - name: Restart Tomcat
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.TOMCAT_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_KEY }}
        proxy_host: ${{ secrets.BASTION_IP }}
        proxy_username: ubuntu
        proxy_key: ${{ secrets.SSH_KEY }}
        script: |
          cp /home/ubuntu/target/dptweb-1.0.war /home/ubuntu/tomcat9/webapps/dptweb.war
          /home/ubuntu/tomcat9/bin/shutdown.sh
          sleep 5
          /home/ubuntu/tomcat9/bin/startup.sh
      
