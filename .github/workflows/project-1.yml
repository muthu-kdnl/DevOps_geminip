name: Java CI Build

on:
  push:
    branches: ["main" ]
    paths:
      - 'DevOps-Project-01/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      # Optional: switch to the project directory before building if needed
      run: cd DevOps-Project-01/Java-Login-App && mvn clean package
      
